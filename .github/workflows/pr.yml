name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
        version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
        node-version: "20"
        cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Tests
        run: pnpm run test
