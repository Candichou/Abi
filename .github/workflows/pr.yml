name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install 

      - name: Run Lint
        run: pnpm run lint

      - name: Run Type check
        run: pnpm run typecheck

      - name: Run Build
        run: pnpm run build

      - name: Run Tests
        run: pnpm run test
